# Render Blueprint for WorldScope Intelligence: the free ($0) layout.
# Docs: https://render.com/docs/blueprint-spec
#
# Layout (all in Frankfurt, the closest Render region to Central Asia):
#   worldscope         web app (Next.js)     free: sleeps after 15 min idle, ~1 min to wake
#   worldscope-api     API (FastAPI)         free: sleeps the same way
#   worldscope-db      PostgreSQL 16         free: 1 GB, EXPIRES 30 days after creation
#   worldscope-kv      Key Value (queue)     free: 25 MB, in memory
#
# What the free plan leaves out, on purpose and visibly on the Settings page:
#   - No background workers (Render has no free plan for them), so nothing is collected
#     on a schedule. WORKERS_ENABLED=false makes the status page say "Not deployed".
#   - No pre-deploy command, so the API applies migrations when it starts
#     (RUN_MIGRATIONS_ON_START=true, see backend/bin/start-api).
#   - Free services cannot receive private-network traffic, so the web app reaches the
#     API through its public URL. Set API_INTERNAL_URL on `worldscope` to the API's
#     https://....onrender.com address once it exists.
#
# To move to an always-on paid layout, see "Deploy to Render" in README.md.
# AI features stay off (LLM_PROVIDER=none) until you set LLM_PROVIDER=anthropic and
# ANTHROPIC_API_KEY on worldscope-api.

services:
  - type: web
    name: worldscope
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /robots.txt
    buildFilter:
      paths:
        - frontend/**
    envVars:
      # The API's public URL, e.g. https://worldscope-api.onrender.com
      - key: API_INTERNAL_URL
        sync: false

  - type: web
    name: worldscope-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/ready
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_JSON
        value: "true"
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: WORKERS_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: worldscope-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: worldscope-kv
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: none
      - key: AI_DAILY_BUDGET_USD
        value: "3"

  - type: keyvalue
    name: worldscope-kv
    plan: free
    region: frankfurt
    # A task queue must never silently drop jobs to free memory.
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: worldscope-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: worldscope
    user: worldscope
    ipAllowList: []
