# Production overrides, layered on docker-compose.yml:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml --env-file .env up -d
# Only Caddy is reachable from outside (80/443, automatic HTTPS for DOMAIN).
# The API, database and Redis have no published ports; the web app reaches the API
# over the internal network.

services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  api:
    ports: !reset []
    environment:
      ENVIRONMENT: production
      LOG_JSON: "true"
  migrate:
    environment:
      ENVIRONMENT: production
  worker:
    environment:
      ENVIRONMENT: production
      LOG_JSON: "true"
  beat:
    environment:
      ENVIRONMENT: production
      LOG_JSON: "true"
  frontend:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env for production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal]

volumes:
  caddydata:
  caddyconfig:
