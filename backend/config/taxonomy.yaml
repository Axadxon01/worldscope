# Categories and regions used to classify articles and events.
# Loaded into the `topics` table by `python -m worldscope.cli sync`.

categories:
  - slug: geopolitics
    name: Geopolitics
    covers: Power relations between states, alliances, spheres of influence, strategy
  - slug: diplomacy
    name: Diplomacy
    covers: Official visits, talks, agreements, statements between governments and international bodies
  - slug: conflict
    name: Conflict
    covers: Armed conflict, attacks, ceasefires, border clashes, civil unrest
  - slug: defense
    name: Defense
    covers: Armed forces, procurement, exercises, doctrine, defense budgets
  - slug: economy
    name: Economy
    covers: Growth, inflation, monetary policy, markets, public finances
  - slug: trade
    name: Trade
    covers: Trade flows, tariffs, sanctions on trade, supply chains, trade agreements
  - slug: energy
    name: Energy
    covers: Oil, gas, power, nuclear energy, energy infrastructure and prices
  - slug: technology
    name: Technology
    covers: Technology policy, critical technologies, digital infrastructure, AI
  - slug: cybersecurity
    name: Cybersecurity
    covers: Cyberattacks, vulnerabilities, attribution, cyber policy
  - slug: environment
    name: Environment
    covers: Climate, disasters, water, environmental policy
  - slug: public-health
    name: Public health
    covers: Outbreaks, health systems, health policy
  - slug: society
    name: Society
    covers: Elections, protests, human rights, migration, culture, domestic politics

# Regions are not listed here: continents and subregions come from the UN geoscheme
# fields of Natural Earth (public domain) in countries.csv, built by
# scripts/build_countries.py. The UN's own M49 table carries no licence, so it is not
# copied.
#
# Focus regions are shown on their own throughout the product. The sync checks that
# each one's membership in the data matches the list below, so a change upstream is
# noticed instead of silently moving a country.
focus_regions:
  - slug: central-asia
    countries: [KAZ, KGZ, TJK, TKM, UZB]
