[project]
name = "worldscope"
version = "0.1.0"
description = "WorldScope Intelligence backend: API, ingestion workers and analysis pipeline"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.14",
    "anthropic>=0.40",
    "argon2-cffi>=25.1",
    "celery[redis]>=5.4",
    "defusedxml>=0.7.1",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pgvector>=0.3",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.3",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20261113",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worldscope"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF", "ASYNC", "DTZ", "PT", "TID",
]
ignore = [
    "S101",  # assert is fine in tests; production code does not rely on it
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "TID251"]  # tests may use SQL to probe the database directly
"migrations/**" = ["E501", "TID251"]  # migrations are DDL; SQL strings belong there

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlalchemy.text".msg = "Raw SQL strings are banned; use ORM or Core expressions. A reviewed exception needs `# noqa: TID251` and a reason."

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["worldscope", "tests"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a running PostgreSQL and Redis (DATABASE_URL and REDIS_URL set)",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
# SQLAlchemy's async engine runs code in greenlets; trace them, or coverage under-reports.
concurrency = ["greenlet", "thread"]
source = ["worldscope"]
