# WorldScope sources: what is collected, from where, and under which terms.
#
# Every RSS URL below was fetched live on 2026-11-20 by scripts/check_feeds.py: it
# answered 200, parsed as RSS/Atom, had recent items, and robots.txt allowed it.
# Re-run the check any time:  cd backend && uv run python ../scripts/check_feeds.py
#
# A source is collected only when `enabled: true`, and only after `review: approved`:
# the publisher's terms have been read, `terms_url` filled in, and `ownership` confirmed.
# Sources with an open licence (public domain, OGL, CC BY, GDELT) are pre-approved.
# All others start as `pending` and are reviewed in Milestone 2 before enabling.
#
# Fields
#   type             rss | official (a government or international body's own feed) | api
#   ownership        public_broadcaster | state | state_funded | government | intergovernmental
#                    | private | nonprofit | null (not yet confirmed). Shown to users as a fact,
#                    so it must be confirmed during review.
#   is_primary       true when the publisher is itself a party (its statements are primary sources)
#   storage_policy   link_only | snippet (headline + feed summary + link). Full text is never stored.
#
# Iranian outlets (IRNA, Press TV, Tasnim, Tehran Times) were unreachable from the build
# environment; Iranian reporting arrives through GDELT until a direct feed is verified.

