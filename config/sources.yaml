  homepage: https://www.gdeltproject.org
  publisher_country: null
  language: multi
  focus:
  - global
  ownership: nonprofit
  is_primary: false
  licence: 'GDELT terms: free for any use with citation and link to gdeltproject.org'
  storage_policy: snippet
  terms_url: https://www.gdeltproject.org/about.html#termsofuse
  review: approved
  enabled: true
  rate_limit: about 1 request per 5 seconds
