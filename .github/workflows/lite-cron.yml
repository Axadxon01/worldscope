name: Lite scheduled jobs

# WorldScope Lite sleeps on Render's free plan, so its own timer stops with it. These schedules wake
# it and run one job each. Needs the repository secret LITE_CRON_TOKEN (same value as CRON_TOKEN on
# Render); without it the workflow does nothing. Scheduled workflows run from the default branch.
on:
  schedule:
    - cron: "15 1,7,13,19 * * *"   # refresh news every 6 hours (06:15, 12:15, 18:15, 00:15 Tashkent)
    - cron: "30 2 * * *"           # morning digest, 07:30 Tashkent
    - cron: "0 5 * * 1"            # followed pairs, Monday 10:00 Tashkent
    - cron: "40 22 * * 0"          # sanctions lists, Monday 03:40 Tashkent
  workflow_dispatch:
    inputs:
      job:
        description: Which job
        type: choice
        options: [refresh, digest, weekly, sanctions]
        default: refresh

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Call WorldScope Lite
        env:
          TOKEN: ${{ secrets.LITE_CRON_TOKEN }}
          URL: ${{ vars.LITE_URL || 'https://worldscope-lite.onrender.com' }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ inputs.job }}
        run: |
          if [ -z "$TOKEN" ]; then echo "LITE_CRON_TOKEN is not set; nothing to do."; exit 0; fi
          case "$SCHEDULE" in
            "30 2 * * *") JOB=digest ;;
            "0 5 * * 1") JOB=weekly ;;
            "40 22 * * 0") JOB=sanctions ;;
            "") JOB="${INPUT_JOB:-refresh}" ;;
            *) JOB=refresh ;;
          esac
          echo "job: $JOB"
          # a sleeping free service takes up to a minute or two to start
          for i in $(seq 1 12); do
            if curl -sf -m 20 "$URL/healthz" > /dev/null; then break; fi
            echo "waiting for the service ($i)"; sleep 15
          done
          curl -sS --fail-with-body -m 900 -X POST -H "x-cron-token: $TOKEN" "$URL/cron/$JOB"
          echo
