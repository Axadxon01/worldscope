name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: worldscope_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d worldscope_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      WORLDSCOPE_INTEGRATION: "1"
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/worldscope_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123
      LLM_PROVIDER: fake
      LOG_JSON: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=worldscope --cov-report=term-missing

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=moderate

  compose:
    name: Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/setup_env.py
      - run: docker compose -f infra/docker-compose.yml --env-file .env config --quiet
      - run: DOMAIN=ci.example.org docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml --env-file .env config --quiet

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the backend image
        run: docker build --tag worldscope-backend:ci ./backend
      - name: Build the frontend image
        run: docker build --tag worldscope-frontend:ci ./frontend
      - name: Backend image starts and imports the app
        run: >-
          docker run --rm
          -e DATABASE_URL=postgresql://ci:ci@localhost:5432/ci
          -e REDIS_URL=redis://localhost:6379/0
          -e SECRET_KEY=ci-image-smoke-test-placeholder-value
          -e LLM_PROVIDER=none
          worldscope-backend:ci
          python -c "from worldscope.api.main import create_app; create_app(); print('ok')"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks CLI scans the whole history; it also works on a repository's first push.
      - name: Scan the full git history for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact
